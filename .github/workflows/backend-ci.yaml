name: Backend CI

on:
  push:
    branches[main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_DB: fornada_certa
            POSTGRES_USER: padaria123
            POSTGRES_PASSWORD: padaria123
          ports:
            - 5432:5432
          options:
            --health-cmd pg_isready
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10

        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
          - uses: gradle/actions/setup-gradle@v4
          - run: cmhod +x gradlew
          - run: .gradlew test