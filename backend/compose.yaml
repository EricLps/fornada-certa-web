services:
  postgres:
    image: 'postgres:17'
    container_name: 'fornada-certa-db'
    environment:
      - 'POSTGRES_DB=fornada_certa'
      - 'POSTGRES_USER=padaria123'
      - 'POSTGRES_PASSWORD=padaria123'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'

volumes:
  postgres-data:
